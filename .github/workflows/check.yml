name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # oxlint, oxfmt and tsc are prebuilt native binaries pulled in by pnpm —
      # no Rust or Go toolchain is needed here.

      # mulch is entirely client-side and needs no secrets, so there is no
      # 1Password step here. If that changes, add `1password/install-cli-action@v4`
      # and wrap the run below in `op run --env-file=.env.example --`, with
      # OP_SERVICE_ACCOUNT_TOKEN as the only repo secret — see .env.example.
      # The pinned Playwright Chromium (the headless host ./scripts/drive boots). Keyed on
      # the lockfile, which moves on every dependency change, not only the playwright pin —
      # restore-keys turns those misses into a restore-then-top-up by setup's
      # `playwright install` rather than a full re-download, and an exact hit skips it.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - run: ./scripts/setup
      - run: ./scripts/check
