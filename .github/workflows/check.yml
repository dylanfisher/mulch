name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # oxlint, oxfmt and tsc are prebuilt native binaries pulled in by pnpm —
      # no Rust or Go toolchain is needed here.

      # mulch is entirely client-side and needs no secrets, so there is no
      # 1Password step here. If that changes, add `1password/install-cli-action@v1`
      # and wrap the run below in `op run --env-file=.env.example --`, with
      # OP_SERVICE_ACCOUNT_TOKEN as the only repo secret — see .env.example.
      - run: ./scripts/setup
      - run: ./scripts/check
